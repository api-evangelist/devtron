openapi: 3.0.0
info:
  version: 1.0.0
  title: Devtron APIs Specs Applications Cache Management API
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  description: Application management operations including creation, listing, and updates
servers:
- url: http://localhost/orchestrator
  description: Local development server
tags:
- name: Cache Management
  description: Endpoints for managing authentication and authorization caches.
  x-displayName: Cache Management
paths:
  /user/role/cache:
    get:
      tags:
      - Cache Management
      summary: Get Role Cache Dump
      operationId: GetRoleCacheDump
      description: Retrieves a dump of the role cache. Requires super admin privileges.
      responses:
        '200':
          description: Cache dump data.
          content:
            application/json:
              schema:
                type: object
        '403':
          $ref: '#/components/responses/Forbidden'
      security: []
  /user/role/cache/invalidate:
    get:
      tags:
      - Cache Management
      summary: Invalidate Role Cache
      operationId: InvalidateRoleCache
      description: Clears the role cache. Requires super admin privileges.
      responses:
        '200':
          description: Cache invalidation status.
          content:
            application/json:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
      security: []
components:
  responses:
    Forbidden:
      description: Forbidden. User does not have permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        status:
          type: string
        result:
          type: object
          nullable: true
        errors:
          type: array
          items:
            type: object
            properties:
              userMessage:
                type: string
                nullable: true
              internalMessage:
                type: string
                nullable: true
x-tagGroups:
- name: Common Devtron automation APIs
  tags:
  - Metadata
  - Jobs
  - Helm Charts
  - List Applications
  - Applications
  - Labels
  - bulk_other
  - BulkUpdate
  - SSO Configuration
  - User Management
  - Role Group Management
  - RBAC
  - Authentication
  - Policy Management
  - Cache Management
  - Cluster Environment
  - Cluster Management
  - Environment Management
  - Change Chart
  - Clone Workflow
  - Deployment History
  - K8s Resource
  - Resource Recommendation
  - Workflow Management
  - Devtron Server version
  - GitOps Validation
  - Notifications
