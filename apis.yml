aid: devtron
name: Devtron
description: >-
  Devtron is an open-source, AI-native Kubernetes management and software
  delivery platform that unifies application, infrastructure, and cost
  management for engineering, DevOps, and SRE teams. It provides Kubernetes-native
  CI/CD, GitOps (ArgoCD/FluxCD), multi-cluster operations, security and compliance
  governance, observability, and FinOps in a single interface, with 100+ tool
  integrations and an agentic SRE assistant. Devtron exposes a programmable
  orchestrator REST API (OpenAPI 3.0, 110 operations) covering application, job,
  Helm chart, deployment, bulk-action, RBAC, SSO, cluster/environment and
  notification management, authenticated with RBAC-scoped API tokens. Backed by
  Insight Partners. Enriched by the API Evangelist pipeline from Devtron's public
  developer surface.
